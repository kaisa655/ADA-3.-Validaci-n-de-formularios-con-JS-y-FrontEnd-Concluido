
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar videojuego - PublicArcade</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="container py-5">
        <h1 class="mb-4">Editar videojuego</h1>

        <div id="mensajeEditar" class="mb-3" role="alert"></div>

        <form id="formEditar" enctype="multipart/form-data" novalidate>

            <input type="hidden" id="idJuego" name="id">

            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control"
                       id="titulo" name="titulo"
                       maxlength="50" required>
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control"
                          id="descripcion" name="descripcion"
                          maxlength="500" required></textarea>
            </div>

            <div class="mb-3">
                <label for="categoria" class="form-label">Categoría</label>
                <select class="form-select" id="categoria"
                        name="categoria" required>
                    <option value="">Selecciona una categoría</option>
                    <option value="Acción">Acción</option>
                    <option value="Aventura">Aventura</option>
                    <option value="Estrategia">Estrategia</option>
                    <option value="Deportes">Deportes</option>
                    <option value="Puzzle">Puzzle</option>
                    <option value="Terror">Terror</option>
                    <option value="Otros">Otros</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="urlJuego" class="form-label">URL del videojuego</label>
                <input type="url" class="form-control"
                       id="urlJuego" name="urlJuego" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Portada actual</label>
                <div>
                    <img id="portadaActual"
                         src=""
                         alt="Portada actual"
                         class="img-fluid mb-3"
                         style="max-width: 250px;">
                </div>

                <label for="imagenJuego" class="form-label">
                    Cambiar portada (opcional)
                </label>

                <input type="file" class="form-control"
                       id="imagenJuego" name="imagenJuego"
                       accept="image/png,image/jpeg,image/webp">
                <small class="text-muted">
                    JPG, PNG o WEBP. Máximo 1 MB.
                </small>
            </div>

            <button type="submit" class="btn btn-primary">
                Guardar cambios
            </button>

            <a href="explorar.html" class="btn btn-secondary">
                Cancelar
            </a>

        </form>
    </main>

    <script src="js/editar.js"></script>
</body>
</html>
