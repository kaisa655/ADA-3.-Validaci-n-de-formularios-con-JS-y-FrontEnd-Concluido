
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar videojuego - PublicArcade</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- Encabezado -->
    <header>
        <!-- Conserva aquí el encabezado original de PublicArcade -->
    </header>

    <main class="container py-5">
        <h1 class="mb-4">Publicar videojuego</h1>

        <form id="formPublicar" enctype="multipart/form-data" novalidate>

            <div class="mb-3">
                <label for="titulo" class="form-label">Título del videojuego</label>
                <input
                    type="text"
                    class="form-control"
                    id="titulo"
                    name="titulo"
                    maxlength="50"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea
                    class="form-control"
                    id="descripcion"
                    name="descripcion"
                    maxlength="500"
                    required
                ></textarea>
            </div>

            <div class="mb-3">
                <label for="categoria" class="form-label">Categoría</label>
                <select
                    class="form-select"
                    id="categoria"
                    name="categoria"
                    required
                >
                    <option value="">Selecciona una categoría</option>
                    <option value="Acción">Acción</option>
                    <option value="Aventura">Aventura</option>
                    <option value="Estrategia">Estrategia</option>
                    <option value="Deportes">Deportes</option>
                    <option value="Puzzle">Puzzle</option>
                    <option value="Terror">Terror</option>
                    <option value="Otros">Otros</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="urlJuego" class="form-label">URL del videojuego</label>
                <input
                    type="url"
                    class="form-control"
                    id="urlJuego"
                    name="urlJuego"
                    placeholder="https://ejemplo.com"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="imagenJuego" class="form-label">Portada del videojuego</label>
                <input
                    type="file"
                    class="form-control"
                    id="imagenJuego"
                    name="imagenJuego"
                    accept="image/png,image/jpeg,image/webp"
                >
                <small class="form-text text-muted">
                    Formatos JPG, PNG o WEBP. Tamaño máximo: 1 MB.
                </small>
            </div>

            <img
                id="vistaPrevia"
                class="img-fluid d-none mb-3"
                alt="Vista previa de la portada"
                style="max-width: 250px;"
            >

            <div id="mensajePublicar" class="mb-3" role="alert"></div>

            <button type="submit" class="btn btn-primary">
                Publicar videojuego
            </button>

        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/publicar.js"></script>

</body>
</html>
